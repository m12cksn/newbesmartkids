name: Teacher Package QA
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Semua migrasi dan uji fungsi paket sekolah
        run: |
          psql -v ON_ERROR_STOP=1 -q -c "create role anon; create role authenticated; create schema extensions; create extension pgcrypto schema extensions;"
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -v ON_ERROR_STOP=1 -q -c "begin" -f scripts/sql/verify-teacher.sql -c "rollback"
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_URL: http://127.0.0.1:54329
      SUPABASE_PUBLISHABLE_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx eslint src/lib/teacher.ts src/components/teacher src/app/guru src/app/api/guru src/app/api/admin src/components/auth scripts/smoke-teacher.mjs scripts/verify-teacher.mjs scripts/mock-supabase-auth.mjs
      - run: node --experimental-strip-types scripts/verify-teacher.mjs
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - name: Browser QA
        run: |
          node scripts/mock-supabase-auth.mjs > /tmp/mock.log 2>&1 &
          npm run start -- --hostname 127.0.0.1 > /tmp/next-teacher.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke-teacher.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teacher-screenshots
          path: /tmp/teacher-screenshots
          if-no-files-found: ignore

name: Parent Landing SEO QA
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  seo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx eslint src/lib/site.ts src/app/robots.ts src/app/sitemap.ts src/app/layout.tsx src/app/page.tsx "src/app/kelas/[slug]/page.tsx" "src/app/kelas/[slug]/materi/[materiSlug]/page.tsx" src/components/home/SiteHeader.tsx
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - name: Browser QA
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/next-seo.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke-parent-landing-seo.mjs

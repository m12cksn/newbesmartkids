name: Grade 8 Lines QA
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  lines8:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types scripts/verify-grade-eight-lines.mjs
      - run: npx eslint src/data/grade-eight-lines.ts src/components/learn/GradeEightLines.tsx src/components/learn/GradeEightLinesArt.tsx src/chapters/kelas-8-persamaan-garis-lurus/meta.ts src/chapters/kelas-8-persamaan-garis-lurus/Chapter.tsx
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - name: Browser QA
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/next-lines8.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          node --experimental-strip-types scripts/smoke-grade-eight-lines.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade-eight-lines-screenshots
          path: /tmp/grade-eight-lines-screenshots
          if-no-files-found: ignore

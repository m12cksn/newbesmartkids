name: Login QA
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  login:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_URL: http://127.0.0.1:54329
      SUPABASE_PUBLISHABLE_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx eslint src/proxy.ts src/lib src/components/auth src/app/api src/app/masuk src/app/akun src/app/admin
      - run: node --experimental-strip-types scripts/verify-renewal.mjs
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - name: Browser QA
        run: |
          node scripts/mock-supabase-auth.mjs > /tmp/mock.log 2>&1 &
          npm run start -- --hostname 127.0.0.1 > /tmp/next-login.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke-login.mjs
          node scripts/smoke-renewal.mjs
          node scripts/smoke-paket-jenjang.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-screenshots
          path: /tmp/login-screenshots
          if-no-files-found: ignore

name: Daily arithmetic QA
on:
  pull_request:
    branches: [master]
    paths: ['src/components/mastering/**', 'src/lib/daily-arithmetic.ts', 'src/app/mastering-perkalian-pembagian/**', 'src/components/home/DailyPracticeCard.tsx', 'src/app/page.tsx', 'scripts/*daily-arithmetic*', '.github/workflows/daily-arithmetic-qa.yml']
  workflow_dispatch:
jobs:
  daily-practice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types --test scripts/verify-daily-arithmetic.mjs
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - name: Test daily practice in browser
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/daily-next.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          node --experimental-strip-types scripts/smoke-daily-arithmetic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-arithmetic-screenshots
          path: /tmp/daily-arithmetic-screenshots
          if-no-files-found: ignore

name: Grade 1 Addition QA
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node --test scripts/verify-grade-one-addition.mjs
      - run: node --experimental-strip-types --test scripts/verify-grade-one-counting.mjs
      - run: node --test scripts/verify-grade-one-subtraction.mjs
      - run: node --test scripts/verify-grade-one-shapes.mjs
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/next.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke-grade-one-addition.mjs
          node scripts/smoke-grade-one-subtraction.mjs
          node scripts/smoke-grade-one-shapes.mjs
          node scripts/smoke-grade-one-measurement.mjs
          node --experimental-strip-types scripts/smoke-grade-one-chapters-one-to-three.mjs

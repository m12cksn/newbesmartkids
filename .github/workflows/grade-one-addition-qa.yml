name: Grade 1 Addition QA
on:
  push:
    branches: [feat/grade1-addition-to-10]
  pull_request:
    paths:
      - 'src/components/learn/GradeOneAddition.tsx'
      - 'src/components/learn/AdditionInteractions.tsx'
      - 'src/data/grade-one-addition*.ts'
      - 'scripts/verify-grade-one-addition.mjs'
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/verify-grade-one-addition.mjs
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/next.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke-grade-one-addition.mjs

name: Grade 1 Operations 20 QA
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  op20:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types scripts/verify-grade-one-op20-v2.mjs
      - run: npx eslint src/data/grade-one-op20-v2.ts src/components/learn/GradeOneOp20V2.tsx src/chapters/kelas-1-operasi-20/meta.ts src/chapters/kelas-1-operasi-20/Chapter.tsx scripts/verify-grade-one-op20-v2.mjs scripts/smoke-grade-one-op20-v2.mjs
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - name: Browser QA
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/next-op20.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          node --experimental-strip-types scripts/smoke-grade-one-op20-v2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade-one-op20-v2-screenshots
          path: /tmp/grade-one-op20-v2-screenshots
          if-no-files-found: ignore

name: Grade 9 Solids QA
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  solids9:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types scripts/verify-grade-nine-solids.mjs
      - run: npx eslint src/data/grade-nine-solids.ts src/components/learn/GradeNineSolids.tsx src/components/learn/GradeNineSolidsArt.tsx src/chapters/kelas-9-bangun-ruang/meta.ts src/chapters/kelas-9-bangun-ruang/Chapter.tsx
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - name: Browser QA
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/next-solids9.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          node --experimental-strip-types scripts/smoke-grade-nine-solids.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade-nine-solids-screenshots
          path: /tmp/grade-nine-solids-screenshots
          if-no-files-found: ignore

<style>
  /* V5 Orang tua bukan guru. Konsep: latar peach, kutipan besar suara orang tua, lalu tiga HP masuk berurutan dari kanan. */
  :root { --jg: #c2410c; --jg-muda: #fff1e6; }
  .stage { background: var(--jg-muda); }
  .kutip-tanda { position: absolute; left: 70px; top: 330px; width: 200px; height: 200px; }
  .kutip { font-size: 100px; font-weight: 900; line-height: 1.08; color: var(--tinta); }
  .kutip em { font-style: normal; color: var(--jg); }
  .sedang { font-size: 78px; font-weight: 800; line-height: 1.15; }
  .sedang em { font-style: normal; color: var(--jg); }
  .hp { border-width: 12px; border-radius: 52px; border-color: var(--tinta); }
  .label { margin-top: 26px; text-align: center; font-size: 44px; font-weight: 800; line-height: 1.2; }
  .label .n { display: inline-flex; width: 64px; height: 64px; border-radius: 50%; background: var(--jg); color: #fff; align-items: center; justify-content: center; margin-right: 14px; font-size: 38px; vertical-align: middle; }
  .akhir { position: absolute; inset: 0; background: var(--jg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; color: #fff; text-align: center; padding: 0 90px 160px; }
  .akhir .harga { font-size: 50px; font-weight: 700; line-height: 1.35; }
  .akhir .situs { font-size: 60px; font-weight: 900; }
</style></head>
